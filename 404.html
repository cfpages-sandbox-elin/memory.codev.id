<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Codev Memory</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: #151e32;
      border: 1px solid #27354f;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
    }
    .code {
      font-size: 4rem;
      font-weight: 900;
      color: #3b82f6;
      font-family: ui-monospace, monospace;
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.75rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.75rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.15s;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The memory or asset path you requested does not exist on this console.</p>
    <a href="/">Return to Memory Viewer</a>
  </div>
</body>
</html>
